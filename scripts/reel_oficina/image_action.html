<!doctype html>
<!-- Two independent actions: a contained camera move and a contextual SVG action. -->
<html data-duration="1.6"><head><meta charset="utf-8"><style>
html,body{width:1080px;height:1920px;overflow:hidden;margin:0;background:#10162f}
#back{position:absolute;width:1080px;height:1920px;object-fit:cover;filter:blur(35px) brightness(.42);transform:scale(1.08)}
#art{position:absolute;transform-origin:center;will-change:transform}
#original{display:block;width:100%;height:100%}
#action{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 4px #10151fcc)}
path,circle,rect{vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<img id="back" alt=""><div id="art"><img id="original" alt=""><svg id="action" aria-hidden="true"></svg></div>
<script src="../../content/construccion/motion-runtime.js"></script><script>
const original=document.getElementById('original'),back=document.getElementById('back');
const art=document.getElementById('art'),svg=document.getElementById('action');
const camera=MG.get('camera','push'),action=MG.get('action',{}),color=MG.get('accent','#91e2c0');
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>x*x*(3-2*x);
let iw,ih,fw,fh,path,dot,cursor,boxes=[],nodes=[];
function shape(type,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',type);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,String(v));svg.appendChild(el);return el}
function point(p){return[p[0]*iw,p[1]*ih]}
function build(){
 const points=(action.points||[]).map(point);
 if(action.type==='route'){
  if(points.length<2)throw Error('route requires at least two points');
  const d=action.curve&&points.length===3?`M${points[0]} Q${points[1]} ${points[2]}`:`M${points[0]} `+points.slice(1).map(p=>`L${p}`).join(' ');
  path=shape('path',{d,fill:'none',stroke:color,'stroke-width':8,pathLength:1,'stroke-dasharray':1});
  dot=shape('circle',{r:13,fill:'#fff6ed',stroke:color,'stroke-width':5});
  for(const p of points)nodes.push(shape('circle',{cx:p[0],cy:p[1],r:18,fill:'none',stroke:color,'stroke-width':5}));
 }else if(action.type==='scan'||action.type==='select'){
  const r=action.rect;if(!r||r.length!==4)throw Error('scan/select requires normalized rect');
  const [x,y]=point(r),w=(r[2]-r[0])*iw,h=(r[3]-r[1])*ih;
  boxes=[shape('rect',{x,y,width:w,height:h,rx:16,fill:'none',stroke:color,'stroke-width':7})];
  if(action.type==='scan')path=shape('path',{fill:'none',stroke:'#fff6ed','stroke-width':7});
  else cursor=shape('path',{d:'M0 0 L0 64 L17 49 L32 79 L48 70 L34 42 L61 42 Z',fill:'#fff6ed',stroke:'#10162f','stroke-width':4});
 }else if(action.type==='checks'){
  for(const p of points){const x=p[0],y=p[1];boxes.push(shape('path',{d:`M${x-17} ${y} l13 14 l29 -35`,fill:'none',stroke:color,'stroke-width':11,pathLength:1,'stroke-dasharray':1}));}
 }else if(action.type==='pulse'){
  const [cx,cy]=point(action.center);for(let i=0;i<3;i++)nodes.push(shape('circle',{cx,cy,r:1,fill:'none',stroke:color,'stroke-width':6}));
 }else throw Error('Unknown contextual action');
}
MG.onFrame(t=>{
 if(!iw)return;
 const p=clamp(t/MG.duration),smooth=ease(p);
 let z=.965,px=0,py=0;
 if(camera==='push')z=.95+.045*smooth;
 else if(camera==='pull')z=.995-.045*smooth;
 else if(camera==='truck')px=(2*smooth-1)*.45;
 else if(camera==='rise')py=(1-2*smooth)*.45;
 else if(camera==='orbit'){px=Math.sin(p*Math.PI*1.5)*.35;py=Math.cos(p*Math.PI*1.5)*.35;}
 else throw Error('Unknown camera move');
 const dx=px*(1080-fw*z)/2,dy=py*(1920-fh*z)/2;
 art.style.transform=`translate(${dx}px,${dy}px) scale(${z})`;
 const q=ease(clamp((t-.10)/Math.max(.1,MG.duration-.25)));
 svg.style.opacity=MG.get('show_action',true)?clamp(t/.12):0;
 if(action.type==='route'){
  path.style.strokeDashoffset=1-q;const pos=path.getPointAtLength(path.getTotalLength()*q);
  dot.setAttribute('cx',pos.x);dot.setAttribute('cy',pos.y);
  nodes.forEach((el,i)=>{el.style.opacity=.3+.7*clamp((q-i/Math.max(nodes.length-1,1))*.8+.5)});
 }else if(action.type==='scan'){
  const r=action.rect,x=(r[0]+(r[2]-r[0])*q)*iw;
  path.setAttribute('d',`M${x} ${r[1]*ih} V${r[3]*ih}`);boxes[0].style.opacity=.45;
 }else if(action.type==='select'){
  const r=action.rect;cursor.setAttribute('transform',`translate(${((r[0]+r[2])/2+.18*(1-q))*iw},${((r[1]+r[3])/2+.16*(1-q))*ih}) scale(${iw/1080})`);
  boxes[0].style.opacity=.25+.75*(.5+.5*Math.sin(q*Math.PI*3));
 }else if(action.type==='checks')boxes.forEach((el,i)=>el.style.strokeDashoffset=1-clamp(q*boxes.length-i));
 else if(action.type==='pulse')nodes.forEach((el,i)=>{const v=(p*1.1+i/3)%1;el.setAttribute('r',(Number(action.radius||.04)+v*.04)*iw);el.style.opacity=(1-v)*.8});
 // Review API: rendered image remains contained; the action is a separate SVG layer.
 window.__imageActionReview={camera,action:action.type,original_contained:fw*z<=1080&&fh*z<=1920,progress:p,context_progress:q};
});
(async()=>{
 const src=MG.get('image_url','');if(!src.startsWith('file:'))throw Error('Use a local image file URL');
 original.src=src;back.src=src;await Promise.all([original.decode(),back.decode()]);
 iw=original.naturalWidth;ih=original.naturalHeight;const fit=Math.min(1080/iw,1920/ih);fw=iw*fit;fh=ih*fit;
 art.style.cssText=`width:${fw}px;height:${fh}px;left:${(1080-fw)/2}px;top:${(1920-fh)/2}px`;
 svg.setAttribute('viewBox',`0 0 ${iw} ${ih}`);build();await MG.ready();
})().catch(e=>window.__mgError=e.message);
</script></body></html>
