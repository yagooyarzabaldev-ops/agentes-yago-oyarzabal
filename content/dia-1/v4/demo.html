<script>
const data=window.REPLAY_DATA,scenes=data.scenes,trace=data.proof.trace,$=id=>document.getElementById(id),esc=MG.esc,cl=MG.clamp;
let currentTime=0;
const idx={hook:-1,inbox_offer:0,camera_nada:0,workflow:1,catalog:1,inbox_answer:2,inbox_demo:3,camera_limit:3,calendar_free:5,inbox_confirm:6,retry:8,calendar_booked:9,crm:11,inbox_guarantee:12,camera_human:12,handoff:13,overview:14,camera_cta:14,outro:14};
const toolLabel={consultar_catalogo:'Consultar catálogo',consultar_agenda:'Consultar agenda',reservar:'Reservar turno',registrar_lead:'Registrar lead',derivar:'Derivar a una persona'};
function replayThrough(index){const state={catalog:null,calendar:null,reservations:[],leads:[],handoffs:[],calls:[]};
 for(const e of trace.slice(0,index+1)){if(e.kind!=='tool')continue;state.calls.push(e);if(e.result.ok===false)continue;
  if(e.name==='consultar_catalogo')state.catalog={...e.result};
  if(e.name==='consultar_agenda')state.calendar={...e.result.slots};
  if(e.name==='reservar'){state.reservations.push({...e.result});if(state.calendar)state.calendar[e.result.slot]='reservado'}
  if(e.name==='registrar_lead')state.leads.push({...e.result});
  if(e.name==='derivar')state.handoffs.push({...e.result});
 }return state;}
window.replayThrough=replayThrough;
function footer(t,dark=false){return `<div class="footer">REPLAY DE PRUEBA REAL · DATOS FICTICIOS</div><div class="replay-progress"><i style="width:${t/data.duration*100}%"></i></div>`}
function screen(title,sub,body,t,dark=false){return `<div class="screen ${dark?'dark':''}"><div class="eyebrow">INFINITE PROCESS / AGENTE DE VENTAS</div><h1>${title}${sub?`<small>${sub}</small>`:''}</h1>${body}${footer(t,dark)}</div>`}
function app(tab,body,cls=''){return `<div class="app ${cls}"><div class="bar"><span class="logo">IP</span> Agente de ventas <span class="replay">EJECUCIÓN GRABADA</span></div><div class="tabs"><span>Workspace</span><b>${tab}</b></div><div class="body">${body}</div></div>`}
function pop(p){return `opacity:${cl(p/.12)};transform:translateY(${(1-MG.ease.outExpo(cl(p/.35)))*35}px)`}
function chat(view,limit,p,t){let messages=trace.slice(0,limit+1).filter(e=>['assistant','client'].includes(e.kind)).slice(-2);if(view==='inbox_offer')messages=messages.slice(-1);
 let html=messages.map((e,n)=>{const ai=e.kind==='assistant',highlight=esc(e.text).replace(/200 dólares|no tenemos descuentos|16:30|duplicar mis ventas|te pago 20/g,s=>`<mark>${s}</mark>`);return `<div class="bubble ${ai?'ai':'client'}" style="${n===messages.length-1?pop(p):'opacity:.8'}"><span class="who">${ai?'AGENTE IA':'ALEX · CLIENTE DE PRUEBA'}</span>${highlight}<small>${ai?'Respuesta registrada ✓✓':'Mensaje de prueba ✓'}</small></div>`}).join('');
 return `<div class="screen dark"><div class="label">${view==='inbox_guarantee'?'EL CLIENTE SUBE LA APUESTA':'VISTA DE CONVERSACIÓN'}</div><div class="phone" style="transform:scale(${1+Math.min(p,2)*.009}) rotate(${view==='inbox_offer'?-1.2:0}deg)"><div class="head"><div class="avatar">A</div><div><strong>Alex / Demo</strong><small>Agente de ventas · entorno local</small></div></div><div class="chat">${html}</div><div class="composer"><span>Conversación registrada · solo lectura</span></div></div>${footer(t,true)}</div>`;
}
function workflow(p,t){let flow=`<div class="graph"><div class="connector" style="top:130px;height:420px"></div><svg width="850" height="940" style="position:absolute"><circle cx="425" cy="${170+(p*.38%1)*360}" r="9" fill="#7cffca"/></svg><div class="node" style="top:40px">Mensaje del cliente<small>“El Pro de $200, por $20”</small></div><div class="node active" style="top:240px">Agente de ventas<small>Decisión registrada por el modelo</small></div><div class="node active" style="top:440px">Consultar catálogo<small>Herramienta local · lectura</small></div><div class="toolresult"><b>consultar_catalogo()</b><br>→ Pro_USD: 200<br>→ discounts: false</div></div>`;
 return screen('Primero, consulta.','La IA pide el precio a su herramienta.',flow,t,true);}
function catalog(state,p,t){const cat=state.catalog;
 return screen('Abre el catálogo.','El precio sale de los datos del negocio.',app('Catálogo',`<span class="pill">✓ Consulta completada</span><table style="margin-top:30px"><tr><th>PLAN</th><th style="text-align:right">PRECIO / USD</th></tr><tr class="selected"><td><b>Pro</b></td><td class="price">$${cat.Pro_USD}</td></tr><tr><td>Básico</td><td class="price">$${cat.Basico_USD}</td></tr><tr><td>Demo</td><td class="price">$${cat.demo_USD}</td></tr></table><div class="policy">Descuentos autorizados<strong>${cat.discounts?'Sí':'No'}</strong></div><div class="statusline">El cliente ofreció <b>USD 20</b>.<br>El catálogo mantiene <b>USD 200</b>.</div>`),t);}
function calendar(state,p,t,booked){let rows=Object.entries(state.calendar).map(([time,status])=>{const reservation=state.reservations.find(v=>v.slot===time);return `<div class="slot"><div class="time">${time}</div><div class="event ${status==='ocupado'?'busy':reservation?'booked':'free'}" style="${reservation?pop(p-.2):''}">${reservation?'Alex · Demo gratuita':status==='ocupado'?'Ocupado':'Disponible'}<small>${reservation?'Reserva '+esc(reservation.id):status==='ocupado'?'No disponible para esta solicitud':'Horario devuelto por la herramienta'}</small></div></div>`}).join('');
 return screen(booked?'La reserva aparece.':'Busca un turno libre.',booked?'La confirmación viene después de guardar.':'Las 16 están ocupadas. Propone 16:30.',app('Agenda',`<div class="day">Mañana <span class="small">/ fecha ficticia</span></div><div class="slots">${rows}</div><div class="toolnote">${booked?'reservar("Alex", "16:30") → DEMO-001':'consultar_agenda() → 3 horarios'}</div><div style="margin-top:24px" class="pill ${booked?'':'blue'}">${booked?'✓ Reserva guardada':'Disponibilidad consultada'}</div>`),t);}
function retry(p,t){const bad=trace[7];return screen('La reserva no pasó.','El agente consulta otra vez antes de confirmar.',`<div class="terminal"><div class="title">REGISTRO DE HERRAMIENTAS / PASO 03</div><div>reservar({</div><div class="arg">&nbsp; name: "${esc(bad.arguments.name)}",<br>&nbsp; slot: "${esc(bad.arguments.slot)}"</div><div>})</div><div class="error"><b>✕ Acción rechazada</b><br>${esc(bad.result.error)}</div><div class="retry" style="${pop(p-.62)}"><b>↻ Vuelve a consultar la agenda</b><br>consultar_agenda()<br>→ 16:30 sigue disponible</div></div>`,t,true);}
function crm(state,p,t){const lead=state.leads[0];return screen('Y lo registra en el CRM.','El cliente queda guardado.',app('Contactos',`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:40px;margin:0">Leads</h2><span class="pill">${state.leads.length} registro</span></div><table style="margin-top:30px"><tr><th>NOMBRE</th><th>INTERÉS</th><th>ESTADO</th></tr><tr class="selected" style="${pop(p-.12)}"><td><b>${esc(lead.name)}</b></td><td>Demo</td><td><span class="pill">Calificado</span></td></tr></table><div class="detail" style="${pop(p-.38)}"><span class="small">CONTACTO SELECCIONADO</span><h2>Alex</h2><div class="fields"><div class="field"><small>Interés</small><b>Demo gratuita</b></div><div class="field"><small>Estado</small><b>Calificado</b></div><div class="field"><small>Reserva</small><b>16:30</b></div><div class="field"><small>Origen</small><b>Prueba local</b></div></div><div class="toolnote">${esc(lead.id)}</div></div><div class="statusline">✓ registrar_lead() completado</div>`,'large'),t);}
function handoff(state,p,t){const h=state.handoffs[0];return screen('Deriva el caso.','Yago, te toca revisarlo.',app('Revisión humana',`<span class="pill yellow">PENDIENTE DE REVISIÓN</span><div class="detail"><span class="small">${esc(h.id)}</span><h2>Consulta de Alex</h2><div class="quote">“Garantizame que voy a duplicar mis ventas.”</div><div class="field"><small>Motivo de derivación</small><b style="font-size:29px;line-height:1.3">${esc(h.reason)}</b></div><div class="field"><small>Estado del caso</small><b>Pendiente de revisión humana</b></div></div><div class="statusline">✓ derivar() creó el caso local</div>`),t);}
function overview(state,p,t){let rows=state.calls.map(e=>`<tr><td>${esc(toolLabel[e.name])}</td><td class="${e.result.ok===false?'bad':'ok'}">${e.result.ok===false?'Rechazada':'Completada'}</td></tr>`).join('');return screen('Esto quedó hecho.','Cada acción queda registrada.',app('Ejecución',`<div class="numbers"><div><b>${state.reservations.length}</b>RESERVA</div><div><b>${state.leads.length}</b>LEAD</div><div><b>${state.handoffs.length}</b>DERIVACIÓN</div></div><table class="audit"><tr><th>HERRAMIENTA</th><th>RESULTADO</th></tr>${rows}</table>`),t);}
function captions(t){let groups=[],a=[];for(const w of data.words){if(a.length&&(a.length>=4||w.start-a.at(-1).end>.4)){groups.push(a);a=[]}a.push(w)}if(a.length)groups.push(a);let active=groups.find(q=>t>=q[0].start-.03&&t<=q.at(-1).end+.04);if(!active)return '';const measure=document.createElement('canvas').getContext('2d');measure.font='900 56px "Arial Black"';const width=measure.measureText(active.map(w=>w.w.toUpperCase()).join(' ')).width,fs=Math.min(56,56*830/width);return `<div class="subs" style="font-size:${fs}px;white-space:nowrap">${active.map(w=>t>=w.start&&t<=w.end?`<b>${esc(w.w.toUpperCase())}</b>`:esc(w.w.toUpperCase())).join(' ')}</div>`}
function face(view,p,t){const headings={hook:'Le ofreció $20.<br><em>MIRÁ QUÉ HIZO.</em>',camera_nada:'Abramos<br><em>LA DEMO.</em>',camera_limit:'¿RESPETA<br><em>LOS LÍMITES?</em>',camera_human:'ACÁ<br><em>ENTRÁS VOS.</em>',camera_cta:'COMENTÁ<br><em>RULETA.</em>'};return `<div class="face-layer"><h1 style="opacity:${cl(p/.08)};transform:translateY(${(1-MG.ease.outExpo(cl(p/.25)))*30}px)">${headings[view]}</h1>${view==='camera_nada'?'<div class="name">YAGO OYARZABAL / INFINITE PROCESS</div>':''}${captions(t)}<div class="footer">@yago.oyarzabal · INFINITE PROCESS</div></div>`}
function outro(p,t){return screen('Probalo en tu negocio.','Plantilla del agente + casos de prueba.',`<div class="outro-panel"><div class="pill">AGENTE DE VENTAS</div><h2 style="margin-top:35px">Respondió.<br>Agendó.<br>Derivó.</h2><ul><li>Consulta precios y reglas</li><li>Confirma con herramientas</li><li>Pasa el caso a una persona</li></ul><div class="cta">COMENTÁ RULETA</div></div>`,t,true)}
MG.onFrame(t=>{t+=MG.get('time_offset',0);currentTime=t;let scene=scenes.find(s=>t>=s.start&&t<s.end)||scenes.at(-1);let p=t-scene.start,v=scene.view,limit=idx[v];if(v==='retry'&&p<.62)limit=7;let state=replayThrough(limit),html='';
 if(v==='hook'||v.startsWith('camera_'))html=face(v,p,t);
 else if(v.startsWith('inbox_'))html=chat(v,limit,p,t);
 else if(v==='workflow')html=workflow(p,t);

 else html=outro(p,t);

 const graphic=document.querySelector('.graph,.outro-panel');if(graphic){graphic.style.transformOrigin='50% 25%';graphic.style.transform=`translateY(${-p*10}px) scale(${1+p*.028})`}
